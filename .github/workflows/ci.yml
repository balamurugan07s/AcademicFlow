name: EngineeringHub CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality-and-test:
    name: Backend Quality, Security & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: TypeScript Static Type Checking
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Run Automated Test Suite (Unit, Integration & Security Tests)
        working-directory: ./backend
        run: npm test

      - name: Verify Production Compilation Build
        working-directory: ./backend
        run: npm run build

  docker-build-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-quality-and-test]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: engineeringhub-backend:latest
